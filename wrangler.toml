name = "haramin"
main = "src/index.ts"
compatibility_date = "2026-09-25"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "haramin"
database_id = "f058ac8f-18c3-4076-8f3a-d1f266b4da6d"
migrations_dir = "migrations"

[vars]
ASSEMBLYAI_LLM_MODEL = "alibaba/qwen3.5-4b-32k-fast"
DEEPSEEK_MODEL = "deepseek-flash"
